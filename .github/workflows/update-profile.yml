name: Refresh profile
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: read
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Discover all public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_repositories.py
      - name: Commit generated sections only when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh public repository index"
          git push
